services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs_db
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: node src/api.js
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: jobs_db
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: node src/worker.js
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: jobs_db
      JOB_FILE: /data/jobs.log
      LEASE_SECONDS: ${LEASE_SECONDS:-5}
      WORK_MIN_MS: ${WORK_MIN_MS:-50}
      WORK_MAX_MS: ${WORK_MAX_MS:-300}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 4
    restart: always

volumes:
  pgdata:
